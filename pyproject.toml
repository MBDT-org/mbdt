[project]
name = "mbdt"
version = "0.1.0"
description = "MBDT - supplementary, locally-deployable literacy practice with adaptive Bayesian targeting."
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "rapidfuzz>=3.9",
    "numpy>=1.26",
]

[tool.uv]
package = false
